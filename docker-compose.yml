services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fila
      POSTGRES_USER: fila
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fila}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fila -d fila"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fila
      SPRING_DATASOURCE_USERNAME: fila
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fila}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32bytes-long}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      APP_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ""
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
