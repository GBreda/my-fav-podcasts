server:
  port: 8080

spring:
  application:
    name: fila
  datasource:
    url: jdbc:h2:file:./data/fila;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

fila:
  cors-origin-patterns:
    - http://localhost:*
    - http://127.0.0.1:*
    - https://localhost
    - capacitor://localhost
    - ionic://localhost
    - http://localhost
