spring:
  application:
    name: my-fav-podcasts
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/fila;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.type.preferred_uuid_jdbc_type: CHAR
      hibernate.jdbc.time_zone: UTC
  jackson:
    use-jackson2-defaults: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-long}
    ttl-days: 14
  feed:
    max-episodes: 30
    min-interval: 15m
  cors-origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:8080

logging:
  level:
    app.myfavpodcasts: info
